
name: Build Bedrock Native

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Compile native bridge
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 main.cpp MemoryReader.cpp /Fe:main.exe

      - name: Build rendering test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 render_test.cpp /Fe:render_test.exe user32.lib gdi32.lib

      - name: Build memory test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 memory_test.cpp /Fe:memory_test.exe


      - name: Compile MemoryReader class
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 /c MemoryReader.cpp


      - name: Build MemoryReader test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 reader_test.cpp MemoryReader.cpp /Fe:reader_test.exe


      - name: Build memory scanner
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 memory_scanner.cpp /Fe:memory_scanner.exe

      
      - name: Build candidate scanner
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 candidate_scanner.cpp /Fe:candidate_scanner.exe

          
      - name: Build candidate watcher
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 candidate_watch.cpp MemoryReader.cpp /Fe:candidate_watch.exe

      - name: Build signature test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 signature_test.cpp MemoryReader.cpp /Fe:signature_test.exe


      - name: Build SignatureScanner class test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 signature_class_test.cpp SignatureScanner.cpp MemoryReader.cpp /Fe:signature_class_test.exe

      - name: Build section test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 section_test.cpp MemoryReader.cpp /Fe:section_test.exe


      - name: Build code scanner test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 code_scan_test.cpp SignatureScanner.cpp MemoryReader.cpp /Fe:code_scan_test.exe


      - name: Build ModuleScanner test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 module_scan_test.cpp ModuleScanner.cpp SignatureScanner.cpp MemoryReader.cpp /Fe:module_scan_test.exe


      - name: Build remote pointer test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 remote_pointer_test.cpp MemoryReader.cpp /Fe:remote_pointer_test.exe

      - name: Build pointer module test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 pointer_module_test.cpp /Fe:pointer_module_test.exe

      - name: Build ClientInstance signature test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 client_signature_test.cpp MemoryReader.cpp SignatureScanner.cpp ModuleScanner.cpp /Fe:client_signature_test.exe

      - name: Build memory region test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 memory_region_test.cpp /Fe:memory_region_test.exe

      - name: Build player position test
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 PlayerPositionTest.cpp EntityTracker.cpp MemoryReader.cpp ModuleScanner.cpp SignatureScanner.cpp /Fe:PlayerPositionTest.exe


      - name: Build EntityCache tests
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 EntityCacheTest.cpp /Fe:EntityCacheTest.exe

      - name: Run EntityCache tests
        shell: cmd
        run: EntityCacheTest.exe

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: BedrockNative-Windows
          path: |
            main.exe
            render_test.exe
            memory_test.exe
            reader_test.exe
            memory_scanner.exe
            candidate_scanner.exe
            candidate_watch.exe
            signature_test.exe
            signature_class_test.exe
            section_test.exe
            code_scan_test.exe
            module_scan_test.exe
            remote_pointer_test.exe
            pointer_module_test.exe
            client_signature_test.exe
            memory_region_test.exe
            PlayerPositionTest.exe
          if-no-files-found: error
